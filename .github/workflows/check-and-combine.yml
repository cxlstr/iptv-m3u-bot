name: Check and Combine 3 Separate M3U Streams

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 1. LINK ICIN CALISTIRMA (data klasörünü kullanır)
      - name: Run for Link 1
        run: |
          python scripts/m3u_working_streams_combined.py
          mkdir -p output_links
          cp output/all.m3u output_links/dearbulut.m3u

      # 2. LINK ICIN CALISTIRMA (data2 klasörünü data yapar)
      - name: Run for Link 2
        run: |
          rm -rf data && cp -r data2 data
          python scripts/m3u_working_streams_combined.py
          cp output/all.m3u output_links/iptv_music.m3u

      # 3. LINK ICIN CALISTIRMA (data3 klasörünü data yapar)
      - name: Run for Link 3
        run: |
          rm -rf data && cp -r data3 data
          python scripts/m3u_working_streams_combined.py
          cp output/all.m3u output_links/romaxa.m3u

      # AYRI DOSYALARI GITHUB'A YUKLEME
      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output_links/*.m3u
          git commit -m "Update 3 separate playlists [skip ci]" || exit 0
          git push
